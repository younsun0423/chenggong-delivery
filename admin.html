<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>成功小蜜丰｜後台管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#22302E; --paper:#F3E9D2; --card:#FBF6E9;
    --ocean:#1E5B67; --ocean-dark:#153F48; --seafoam:#7FADA9;
    --coral:#E2532F; --coral-dark:#B93F22; --gold:#E3A94B;
    --radius:14px;
    --shadow:0 2px 0 var(--ink), 0 8px 20px -10px rgba(34,48,46,.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans TC', sans-serif; -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  h1,h2,h3{font-family:'Noto Serif TC', serif; font-weight:900;}
  .mono{font-family:'JetBrains Mono', monospace;}

  header{
    position:sticky; top:0; z-index:50; background:var(--ink); color:var(--paper);
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  header h1{font-size:16px; margin:0; color:var(--paper);}
  header .sub{font-family:'JetBrains Mono',monospace; font-size:10.5px; opacity:.65; margin-top:2px;}
  header button{
    background:var(--ocean); color:var(--paper); border:none; border-radius:999px;
    padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  header button:active{filter:brightness(1.15);}
  #notifyBtn{padding:8px 12px; font-size:15px;}
  #notifyBtn.on{background:var(--gold); color:var(--ink);}

  main{max-width:560px; margin:0 auto; padding:16px;}

  /* ---- 登入畫面 ---- */
  .login-box{
    background:var(--card); border:2px solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:28px 24px; margin-top:60px; text-align:center;
  }
  .login-box h2{font-size:20px; margin:0 0 8px;}
  .login-box p{font-size:13px; color:var(--ocean-dark); margin:0 0 20px; line-height:1.6;}
  .login-box input{
    width:100%; padding:14px; border:2px solid var(--ink); border-radius:10px; background:var(--paper);
    font-family:'JetBrains Mono',monospace; font-size:20px; text-align:center; letter-spacing:6px;
  }
  .login-box button{
    width:100%; margin-top:14px; padding:13px; border:2px solid var(--ink); border-radius:999px;
    background:var(--ocean); color:var(--paper); font-weight:700; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .login-box .err{color:var(--coral-dark); font-size:12.5px; margin-top:10px; font-weight:700; display:none;}

  /* ---- 頁籤：訂單／結算 ---- */
  .view-tabs{display:flex; gap:10px; margin-bottom:18px;}
  .view-tabs button{
    flex:1; border:2px solid var(--ink); background:var(--card); color:var(--ink);
    padding:11px; border-radius:12px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .view-tabs button.active{background:var(--ocean); color:var(--paper);}

  /* ---- 篩選列 ---- */
  .filter-tabs{display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px;}
  .filter-tabs button{
    flex-shrink:0; border:2px solid var(--ink); background:var(--card); color:var(--ink);
    padding:8px 16px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .filter-tabs button.active{background:var(--ink); color:var(--paper);}

  /* ---- 結算畫面 ---- */
  .settlement-range-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .settlement-range-tabs .range-btn{
    flex:1; border:2px solid var(--ink); background:var(--card); color:var(--ink);
    padding:9px 8px; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .settlement-range-tabs .range-btn.active{background:var(--ocean); color:var(--paper);}
  .settlement-date-picker{margin-bottom:14px;}
  .settlement-date-picker input{
    width:100%; padding:11px 13px; border:2px solid var(--ink); border-radius:10px; background:var(--card);
    font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--ink);
  }
  .settlement-hint{font-size:12px; color:var(--ocean-dark); opacity:.75; margin-bottom:14px; line-height:1.6;}
  .settlement-card-wrap{
    background:var(--card); border:2px solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow);
    margin-bottom:12px; overflow:hidden;
  }
  .settlement-card{
    padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer;
  }
  .settlement-card .sc-name{font-family:'Noto Serif TC',serif; font-weight:900; font-size:15px;}
  .settlement-card .sc-arrow{font-size:12px; color:var(--ocean-dark); opacity:.6; margin-left:4px;}
  .settlement-card .sc-count{font-size:11px; color:var(--ocean-dark); opacity:.75; margin-top:2px;}
  .settlement-card .sc-total{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:900; color:var(--coral-dark);}
  .settlement-detail{border-top:2px solid var(--ink); padding:10px 18px;}
  .settlement-detail-row{padding:9px 0; border-bottom:1px dashed var(--seafoam);}
  .settlement-detail-row:last-child{border-bottom:none;}
  .settlement-detail-row .sd-top{display:flex; align-items:center; gap:8px; font-size:12px;}
  .settlement-detail-row .sd-num{font-family:'JetBrains Mono',monospace; font-weight:900; color:var(--coral-dark);}
  .settlement-detail-row .sd-date{color:var(--ocean-dark); opacity:.75; flex:1;}
  .settlement-detail-row .sd-fee{font-family:'JetBrains Mono',monospace; font-weight:700;}
  .settlement-detail-row .sd-merchant{font-size:13px; font-weight:700; margin-top:4px;}
  .settlement-detail-row .sd-items{font-size:12px; color:var(--ocean-dark); opacity:.8; margin-top:2px; white-space:pre-wrap;}
  .settlement-detail-row{cursor:pointer;}
  .settlement-detail-row .sd-expand-arrow{font-size:11px; color:var(--ocean-dark); opacity:.5; flex-shrink:0;}
  .settlement-detail-row .sd-full-detail{
    margin-top:8px; padding-top:8px; border-top:1px dashed var(--seafoam); font-size:12px; line-height:1.8;
  }
  .settlement-detail-row .sfd-row{display:flex; gap:6px;}
  .settlement-detail-row .sfd-row b{flex-shrink:0; width:40px; color:var(--ocean-dark); opacity:.7; font-weight:700;}
  .settlement-detail-row .sfd-row a{color:var(--ocean-dark);}
  .settlement-unassigned{
    background:var(--gold); border:2px solid var(--ink); border-radius:var(--radius);
    padding:12px 16px; font-size:12.5px; font-weight:700; margin-bottom:12px; line-height:1.6;
  }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ocean-dark); opacity:.7; font-size:13.5px; line-height:1.8;
  }

  .section-heading{
    font-size:13px; font-weight:700; color:var(--ocean-dark); margin:20px 0 10px; padding-left:2px;
  }
  .section-heading:first-child{margin-top:0;}

  /* ---- 訂單卡片 ---- */
  .order-card{
    background:var(--card); border:2px solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:16px; margin-bottom:14px;
  }
  .order-card.status-已送達{opacity:.6;}
  .order-card.merchant-order{border-left:6px solid var(--gold);}
  .order-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .order-queue{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:900; color:var(--coral-dark); line-height:1;}
  .order-time{font-size:11px; color:var(--ocean-dark); opacity:.7; margin-top:3px;}
  .status-badge{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;
    border:1.5px solid var(--ink);
  }
  .status-badge.待處理{background:var(--gold); color:var(--ink);}
  .status-badge.處理中{background:var(--coral); color:var(--paper);}
  .status-badge.運送中{background:var(--ocean); color:var(--paper);}
  .status-badge.已送達{background:var(--seafoam); color:var(--ink);}

  .order-info{font-size:13.5px; line-height:1.9;}
  .order-info b{font-weight:700;}
  .order-info .row{display:flex; gap:6px;}
  .order-info .label{flex-shrink:0; color:var(--ocean-dark); opacity:.75; width:60px;}
  .order-info a{color:var(--ocean-dark); text-decoration:underline;}
  .order-info .items-block{white-space:pre-wrap;}
  .remit-check{
    background:var(--gold); border:2px solid var(--ink); border-radius:8px; padding:8px 10px;
    font-size:12.5px; font-weight:700; margin-top:8px; line-height:1.6;
  }
  .collect-total{
    background:var(--seafoam); border:2px solid var(--ink); border-radius:8px; padding:8px 10px;
    font-size:13px; font-weight:700; margin-top:6px; line-height:1.6; color:var(--ink);
  }
  .confirm-payment-btn{
    width:100%; margin-top:10px; padding:11px; border:2px solid var(--ink); border-radius:10px;
    background:#06C755; color:#fff; font-weight:700; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .confirm-payment-btn:hover{filter:brightness(1.06);}
  .payment-confirmed-badge{
    width:100%; margin-top:10px; padding:10px; border:2px solid var(--ink); border-radius:10px;
    background:var(--seafoam); color:var(--ink); font-weight:700; font-size:13px; text-align:center;
  }

  .order-photo{margin-top:8px;}
  .order-photo img{width:70px; height:70px; object-fit:cover; border-radius:8px; border:2px solid var(--ink); cursor:pointer;}

  .goods-amount-picker{margin-top:14px;}
  .goods-amount-picker label{display:block; font-size:11px; font-weight:700; color:var(--ocean-dark); opacity:.75; margin-bottom:5px;}
  .goods-amount-input{
    width:100%; padding:9px 11px; border:2px solid var(--ink); border-radius:10px; background:var(--paper);
    font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; color:var(--ink);
  }
  .goods-amount-picker .collect-total{display:none;}

  .deliverer-picker{margin-top:14px;}
  .deliverer-picker label{display:block; font-size:11px; font-weight:700; color:var(--ocean-dark); opacity:.75; margin-bottom:5px;}
  .deliverer-select{
    width:100%; padding:9px 11px; border:2px solid var(--ink); border-radius:10px; background:var(--paper);
    font-family:inherit; font-size:13px; font-weight:700; color:var(--ink);
  }

  .status-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px;}
  .status-actions button{
    padding:10px 4px; border:2px solid var(--ink); border-radius:10px; background:var(--paper);
    font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .status-actions button.current{background:var(--ink); color:var(--paper);}
  .status-actions button:active{filter:brightness(1.1);}

  .lightbox{
    display:none; position:fixed; inset:0; background:rgba(34,48,46,.85); z-index:200;
    align-items:center; justify-content:center; padding:20px; cursor:zoom-out;
  }
  .lightbox img{max-width:100%; max-height:100%; border-radius:8px;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); padding:11px 20px; border-radius:999px;
    font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:300;
    max-width:min(90vw,360px); text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .order-search-btn{
    width:100%; padding:11px; border:2px solid var(--ink); border-radius:10px; margin-bottom:14px;
    background:var(--card); color:var(--ink); font-weight:700; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .order-search-btn:hover{background:var(--gold);}

  .detail-overlay{
    display:none; position:fixed; inset:0; background:rgba(34,48,46,.85); z-index:250;
    align-items:flex-start; justify-content:center; padding:16px; overflow-y:auto;
  }
  .detail-panel{
    background:var(--paper); border:2px solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:24px 20px; margin:30px auto; max-width:440px; width:100%; position:relative;
  }
  .detail-panel h3{margin:0 0 4px; font-size:18px;}
  .detail-close{
    position:absolute; top:14px; right:14px; background:var(--ink); color:var(--paper); border:none;
    border-radius:999px; width:30px; height:30px; font-size:15px; cursor:pointer;
  }
  .order-search-fields{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .order-search-fields input[type="date"]{
    flex:1 1 150px; padding:10px 11px; border:2px solid var(--ink); border-radius:10px; background:var(--card);
    font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink);
  }
  .order-search-fields input[type="text"]{
    flex:1 1 110px; padding:10px 11px; border:2px solid var(--ink); border-radius:10px; background:var(--card);
    font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink);
  }
  .order-search-fields button{
    flex:0 0 auto; padding:10px 18px; border:2px solid var(--ink); border-radius:10px;
    background:var(--ocean); color:var(--paper); font-weight:700; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .search-result-card{
    background:var(--card); border:2px solid var(--ink); border-radius:10px; padding:12px 14px; margin-bottom:10px;
    font-size:12.5px; line-height:1.8;
  }
  .search-result-card .row{display:flex; gap:6px;}
  .search-result-card .label{flex-shrink:0; color:var(--ocean-dark); opacity:.75; width:56px;}

  .refresh-hint{text-align:center; font-size:11px; color:var(--ocean-dark); opacity:.6; margin:10px 0 4px;}
</style>
</head>
<body>

<header>
  <div>
    <h1>🐝 成功小蜜丰・後台管理</h1>
    <div class="sub" id="dateLabel"></div>
  </div>
  <div style="display:flex; gap:8px;">
    <button id="notifyBtn" title="開啟新訂單通知">🔔</button>
    <button id="refreshBtn">🔄 重新整理</button>
  </div>
</header>

<main>
  <div class="login-box" id="loginBox">
    <h2>🔒 後台登入</h2>
    <p>請輸入後台管理密碼<br>（在試算表「基本設定」分頁的「後台管理密碼」可查看或修改）</p>
    <input id="pinInput" type="password" inputmode="numeric" placeholder="••••" maxlength="12" autofocus>
    <button id="loginBtn">登入</button>
    <div class="err" id="loginErr">密碼錯誤，請確認後重新輸入</div>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="view-tabs">
      <button class="active" id="viewOrdersBtn">📦 訂單</button>
      <button id="viewSettlementBtn">💰 結算</button>
    </div>

    <div id="ordersView">
      <div class="filter-tabs">
        <button class="active" data-filter="全部">全部</button>
        <button data-filter="待處理">待處理</button>
        <button data-filter="處理中">處理中</button>
        <button data-filter="運送中">運送中</button>
        <button data-filter="已送達">已送達</button>
      </div>
      <div id="orderList"></div>
      <div class="refresh-hint">下拉頁面或點右上角重新整理，即可看到最新訂單</div>
    </div>

    <div id="settlementView" style="display:none;">
      <div class="settlement-range-tabs">
        <button type="button" class="range-btn active" data-range="day">單日結算</button>
        <button type="button" class="range-btn" data-range="month">本月總覽</button>
      </div>
      <div class="settlement-date-picker" id="settlementDatePicker">
        <input type="date" id="settlementDate">
      </div>
      <button type="button" class="order-search-btn" id="openOrderSearchBtn">🔍 用日期或單號查詢訂單明細</button>
      <div class="settlement-hint" id="settlementHint">統計本月「已送達」訂單，依指派的外送員加總外送費</div>
      <div id="settlementList"></div>
    </div>
  </div>
</main>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt="訂單照片"></div>

<div class="detail-overlay" id="orderSearchOverlay">
  <div class="detail-panel">
    <button class="detail-close" id="orderSearchClose" aria-label="關閉">✕</button>
    <h3>🔍 查詢訂單明細</h3>
    <div class="hint" style="font-size:12px; color:var(--ocean-dark); opacity:.75; margin-bottom:14px; line-height:1.6;">輸入日期查該天所有訂單，或輸入單號查特定一筆（兩者可單獨或一起用）</div>
    <div class="order-search-fields">
      <input type="date" id="searchDate">
      <input type="text" id="searchQueueNumber" placeholder="單號，例如 5 或 R3">
      <button type="button" id="orderSearchBtn">查詢</button>
    </div>
    <div id="orderSearchResult"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEIJUec1kLTQN0c4rnwGWjrs219WgoqAaRQJwphOJpq_k_W6jY61tMfgByWmQQ646WUw/exec';

  const PIN_STORAGE_KEY = 'mifeng_admin_pin';

  const toastEl = document.getElementById('toast');
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 2200);
  }

  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'short' });

  let currentOrders = [];
  let currentFilter = '全部';
  let currentDeliverers = [];
  // 優先順序：網址帶的 ?key= 參數 > 瀏覽器記住的密碼
  let currentPin = new URLSearchParams(location.search).get('key') || localStorage.getItem(PIN_STORAGE_KEY) || '';

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- 新訂單通知：聲音 + 畫面提示 + 瀏覽器系統通知（選用） ----------
  const originalTitle = document.title;
  let knownOrderKeys = null; // null代表還沒初始化過，第一次載入不觸發通知
  let notifyEnabled = localStorage.getItem('mifeng_notify_on') === '1';

  function updateNotifyBtn(){
    document.getElementById('notifyBtn').classList.toggle('on', notifyEnabled);
  }
  updateNotifyBtn();
  if(notifyEnabled){
    // 每次重新整理頁面，AudioContext 都要重新解鎖一次，提醒使用者點一下確保聲音有效
    setTimeout(()=>{ toast('🔔 通知已開啟，點一下鈴鐺確保這次重新整理後聲音仍有效'); }, 1200);
  }

  // 常駐的 AudioContext：一定要在使用者「剛點擊」的當下建立/解鎖，之後才能在背景收到新訂單時正常播放聲音
  let audioCtx = null;
  function unlockAudio(){
    try{
      if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if(audioCtx.state === 'suspended'){
        audioCtx.resume();
      }
      // 播放一個幾乎聽不到的短音，確保這個瀏覽器分頁的音效權限被正式解鎖
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }catch(err){ /* 部分瀏覽器不支援，忽略即可，畫面內提示仍會正常顯示 */ }
  }

  document.getElementById('notifyBtn').addEventListener('click', ()=>{
    unlockAudio(); // 每次點擊都先解鎖音效（一定要在點擊事件裡直接呼叫，才符合瀏覽器對「使用者手勢」的要求）
    if(!notifyEnabled){
      if('Notification' in window && Notification.permission !== 'granted'){
        Notification.requestPermission().then(perm => {
          notifyEnabled = true;
          localStorage.setItem('mifeng_notify_on', '1');
          updateNotifyBtn();
          toast(perm === 'granted' ? '🔔 通知已開啟（含系統通知＋聲音）' : '🔔 通知已開啟（此頁面內提醒＋聲音，系統通知需允許權限）');
        });
      } else {
        notifyEnabled = true;
        localStorage.setItem('mifeng_notify_on', '1');
        updateNotifyBtn();
        toast('🔔 通知已開啟（含聲音）');
      }
    } else {
      notifyEnabled = false;
      localStorage.setItem('mifeng_notify_on', '0');
      updateNotifyBtn();
      toast('已關閉通知');
    }
  });

  function playBeep(){
    if(!audioCtx) return; // 還沒點過🔔按鈕解鎖過音效，就不強行播放（會被瀏覽器擋掉，且可能報錯）
    try{
      if(audioCtx.state === 'suspended') audioCtx.resume();
      [880, 1046].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.18);
        osc.start(audioCtx.currentTime + i * 0.18);
        osc.stop(audioCtx.currentTime + i * 0.18 + 0.16);
      });
    }catch(err){ /* 部分瀏覽器可能限制自動播放音效，忽略即可 */ }
  }

      knownOrderKeys = new Set(orders.map(o => o.rowKey));

    const freshOnes = orders.filter(o => !knownOrderKeys.has(o.rowKey));

  // ---------- 畫面渲染 ----------
  function formatScheduleDisplay(schedule){
    if(!schedule) return '';
    const d = new Date(schedule);
    if(isNaN(d.getTime())) return schedule.replace('T', ' ');
    const pad = n => String(n).padStart(2, '0');
    return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function createOrderCard(order){
    const card = document.createElement('div');
    card.className = `order-card status-${order.status || '待處理'}`;

      <div class="row"><span class="label">電話</span><span><a href="tel:${escapeHtml((order.phone||'').replace(/\D/g,''))}">${escapeHtml(order.phone || '—')}</a></span></div>

    if(order.note) infoHtml += `<div class="row"><span class="label">備註</span><span>${escapeHtml(order.note)}</span></div>`;

    const isRemit = order.paymentMethod === '匯款';
    infoHtml += `<div class="row"><span class="label">付款</span><span>${isRemit ? '💳 匯款轉帳' : '💵 現場付款'}</span></div>`;
    if(isRemit){
      infoHtml += `<div class="remit-check">🔍 請核對匯款：<strong>${escapeHtml(order.remitName || '—')}</strong>　末五碼 <strong>${escapeHtml(order.remitLast5 || '—')}</strong></div>`;

        <div class="collect-total"></div>

        <button data-status="待處理" class="${order.status === '待處理' || !order.status ? 'current' : ''}">待處理</button>

  function assignDeliverer(order, deliverer){
    order.deliverer = deliverer;
    toast(deliverer ? `已指派給「${deliverer}」` : '已取消指派');

    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'assignDeliverer',
        pin: currentPin,
        sheetName: order.sheetName,
        rowKey: order.rowKey,
        deliverer: deliverer
      })
    })
      .then(r => r.json())
      .then(data => {
        if(data.result !== 'success'){
          toast(data.message || '指派失敗，請重新整理後再試');
        }
      })
      .catch(()=>{ toast('指派失敗，請檢查網路連線'); });
  }

  function confirmPayment(order, cardEl){
    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'confirmPayment',
        pin: currentPin,
        sheetName: order.sheetName,
        rowKey: order.rowKey
      })
    })
      .then(r => r.json())
      .then(data => {
        if(data.result === 'success'){
          order.paymentConfirmed = true;
          if(order.status === '待處理') order.status = '處理中'; // 後端也會自動推進，這裡同步畫面
          toast('✅ 已標記款項確認，客戶可查詢到最新狀態');
          renderOrders();
        } else {
          toast(data.message || '確認失敗，請重新整理後再試');
        }
      })
      .catch(()=>{ toast('確認失敗，請檢查網路連線'); });
  }

  function updateGoodsAmount(order, amount){
    order.goodsAmount = amount;
    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'updateGoodsAmount',
        pin: currentPin,
        sheetName: order.sheetName,
        rowKey: order.rowKey,
        goodsAmount: amount
      })
    })
      .then(r => r.json())
      .then(data => {
        if(data.result === 'success'){
          toast('💰 商品金額已儲存');
        } else {
          toast(data.message || '儲存失敗，請重新整理後再試');
        }
      })
      .catch(()=>{ toast('儲存失敗，請檢查網路連線'); });
  }

  function renderOrders(){
    const list = document.getElementById('orderList');
    const filtered = currentFilter === '全部'
      ? currentOrders
      : currentOrders.filter(o => (o.status || '待處理') === currentFilter);

    if(!filtered.length){
      list.innerHTML = '<div class="empty-state">📭 目前沒有符合條件的訂單</div>';
      return;
    }

    const needsAssignment = filtered.filter(o => o.needsAssignment);
    const immediate = filtered.filter(o => !o.isReservation && !o.needsAssignment);
    const reservations = filtered.filter(o => o.isReservation);

    list.innerHTML = '';

    if(needsAssignment.length){
      const h = document.createElement('div');
      h.className = 'section-heading';
      h.textContent = `⚠️ 待指派外送員・非今日訂單（${needsAssignment.length}）`;
      h.style.color = 'var(--coral-dark)';
      list.appendChild(h);
      needsAssignment.forEach(order => list.appendChild(createOrderCard(order)));
    }

    if(immediate.length){
      const h = document.createElement('div');
      h.className = 'section-heading';
      h.textContent = `📦 今日訂單（${immediate.length}）`;
      list.appendChild(h);
      immediate.forEach(order => list.appendChild(createOrderCard(order)));
    }

    if(reservations.length){
      const h = document.createElement('div');
      h.className = 'section-heading';
      h.textContent = `📅 預約訂單・依預約時間排序（${reservations.length}）`;
      list.appendChild(h);
      reservations.forEach(order => list.appendChild(createOrderCard(order)));
    }
  }

  document.getElementById('lightbox').addEventListener('click', ()=>{
    document.getElementById('lightbox').style.display = 'none';
  });

  function updateStatus(order, newStatus, cardEl){
    const oldStatus = order.status;
    order.status = newStatus; // 先在畫面上樂觀更新，體感更快
    renderOrders();
    toast(`已更新為「${newStatus}」`);

    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'updateStatus',
        pin: currentPin,
        sheetName: order.sheetName,
        rowKey: order.rowKey,
        status: newStatus
      })
    })
      .then(r => r.json())
      .then(data => {
        if(data.result !== 'success'){
          order.status = oldStatus; // 失敗就還原
          renderOrders();
          toast(data.message || '更新失敗，請重新整理後再試');
        }
      })
      .catch(()=>{
        order.status = oldStatus;
        renderOrders();
        toast('更新失敗，請檢查網路連線');
      });
  }

})();
</script>
</body>
</html>
