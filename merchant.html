<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>成功小蜜丰｜商家外送委託</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#22302E; --paper:#DCEEF7; --card:#F2F9FC;
    --ocean:#1E5B67; --ocean-dark:#153F48; --seafoam:#7FADA9;
    --coral:#E2532F; --coral-dark:#B93F22; --gold:#E3A94B;
    --radius:14px;
    --shadow:0 2px 0 var(--ink), 0 8px 20px -10px rgba(34,48,46,.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans TC', sans-serif; -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  h1,h2,h3{font-family:'Noto Serif TC', serif; font-weight:900;}
  .mono{font-family:'JetBrains Mono', monospace;}

  header{
    position:sticky; top:0; z-index:50; background:var(--ink); color:var(--paper);
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  header h1{font-size:16px; margin:0; color:var(--paper);}
  header .sub{font-family:'JetBrains Mono',monospace; font-size:10.5px; opacity:.65; margin-top:2px;}

  main{max-width:520px; margin:0 auto; padding:16px;}

  .urgent-hint{
    display:flex; align-items:center; gap:8px; background:var(--gold); color:var(--ink);
    border:2px solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:12px 16px; margin-bottom:18px; font-size:12.5px; font-weight:700; line-height:1.6;
  }

  /* ---- 表單 ---- */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:700; color:var(--ocean-dark); margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%; padding:11px 13px; border:2px solid var(--ink); border-radius:10px; background:var(--card);
    font-family:inherit; font-size:14px; color:var(--ink);
  }
  .field textarea{min-height:60px; resize:vertical;}
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none; border-color:var(--ocean); box-shadow:0 0 0 3px rgba(30,91,103,.18);
  }
  .field .hint{font-size:11.5px; color:var(--ocean-dark); opacity:.75; margin-top:5px; line-height:1.5;}

  .merchant-select-row{display:flex; gap:8px;}
  .merchant-select-row select{flex:1;}
  #pinMerchantBtn{
    flex-shrink:0; width:48px; border:2px solid var(--ink); border-radius:10px; background:var(--card);
    font-size:18px; cursor:pointer; opacity:.5;
  }
  #pinMerchantBtn.pinned{background:var(--gold); opacity:1;}

  .view-tabs{display:flex; gap:8px; margin-bottom:18px;}
  .view-tab-btn{
    flex:1; border:2px solid var(--ink); background:var(--card); color:var(--ink);
    padding:11px; border-radius:12px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .view-tab-btn.active{background:var(--ocean); color:var(--paper);}

  .query-order-card{
    background:var(--card); border:2px solid var(--ink); border-radius:12px; padding:14px 16px; margin-bottom:12px;
  }
  .query-order-card .qo-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .query-order-card .qo-num{font-family:'JetBrains Mono',monospace; font-weight:900; font-size:16px; color:var(--coral-dark);}
  .query-order-card .qo-time{font-size:11px; color:var(--ocean-dark); opacity:.7;}
  .query-order-card .qo-status{
    font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; border:1.5px solid var(--ink);
  }
  .query-order-card .qo-status.待處理{background:var(--gold);}
  .query-order-card .qo-status.處理中{background:var(--coral); color:#fff;}
  .query-order-card .qo-status.運送中{background:var(--ocean); color:#fff;}
  .query-order-card .qo-status.已送達{background:var(--seafoam);}
  .query-order-card .qo-row{font-size:12.5px; line-height:1.7;}
  .query-order-card .qo-row b{color:var(--ocean-dark);}

  .query-date-group{
    background:var(--card); border:2px solid var(--ink); border-radius:12px; margin-bottom:12px; overflow:hidden;
  }
  .query-date-group summary{
    list-style:none; cursor:pointer; padding:13px 16px; display:flex; align-items:center; justify-content:space-between;
    gap:8px; font-weight:700; font-size:14px; user-select:none;
  }
  .query-date-group summary::-webkit-details-marker{display:none;}
  .query-date-group .qdg-count{font-size:11px; font-weight:600; color:var(--ocean-dark); opacity:.75; display:flex; align-items:center; gap:6px;}
  .query-date-group .qdg-arrow{font-size:12px; transition:transform .2s ease;}
  .query-date-group[open] .qdg-arrow{transform:rotate(90deg);}
  .query-date-group-body{padding:0 12px 12px;}
  .query-date-group .query-order-card{margin-bottom:8px;}
  .query-date-group .query-order-card:last-child{margin-bottom:0;}

  .zone-toggle{display:flex; gap:8px;}
  .zone-toggle button{
    flex:1; border:2px solid var(--ink); background:var(--card); color:var(--ink); opacity:.6;
    padding:12px 8px; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .zone-toggle button.active{background:var(--ocean); color:var(--paper); opacity:1;}

  .schedule-toggle{display:flex; gap:8px; margin-bottom:10px;}
  .schedule-toggle button{
    flex:1; border:2px solid var(--ink); background:var(--card); color:var(--ink); opacity:.6;
    padding:10px 8px; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .schedule-toggle button.active{background:var(--gold); color:var(--ink); opacity:1;}

  /* ---- 拍照確認訂單 ---- */
  .photo-upload-box{
    border:2px dashed var(--ocean); border-radius:12px; padding:16px; text-align:center; background:var(--card);
  }
  .photo-upload-box input[type="file"]{
    border:none; padding:0; background:none;
  }
  .photo-upload-box input[type="file"]::file-selector-button{
    border:2px solid var(--ink); background:var(--ocean); color:var(--paper); font-weight:700;
    padding:9px 18px; border-radius:999px; margin-right:10px; cursor:pointer; font-family:inherit; font-size:13px;
  }
  .photo-preview-box{display:none; align-items:center; gap:12px; margin-top:12px;}
  .photo-preview-box img{
    width:84px; height:84px; object-fit:cover; border-radius:10px; border:2px solid var(--ink);
  }
  .photo-remove-btn{
    border:2px solid var(--ink); background:var(--paper); color:var(--ink); border-radius:999px;
    padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit;
  }

  .submit-btn{
    width:100%; padding:15px; border:2px solid var(--ink); border-radius:999px;
    background:#06C755; color:#fff; font-weight:700; font-size:15px; cursor:pointer; font-family:inherit;
    box-shadow:0 3px 0 var(--ink); margin-top:6px;
  }
  .submit-btn:active{transform:translateY(2px); box-shadow:none;}
  .submit-btn:disabled{opacity:.6; cursor:not-allowed;}

  .result-badge{
    display:none; background:var(--ocean); color:var(--paper); border:2px solid var(--ink); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px; margin-top:18px; text-align:center;
  }
  .result-badge .num{font-family:'JetBrains Mono',monospace; font-size:32px; font-weight:900;}
  .result-badge .label{font-size:13px; margin-top:6px; line-height:1.6;}
  .result-badge.error{background:var(--coral-dark);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); padding:11px 20px; border-radius:999px;
    font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:300;
    max-width:min(90vw,360px); text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div>
    <h1>🐝 成功小蜜丰・商家外送委託</h1>
    <div class="sub" id="dateLabel"></div>
  </div>
</header>

<main>
  <div class="urgent-hint" id="announcementHint" style="display:none;"></div>

  <div class="field merchant-select-field">
    <label>商家名稱</label>
    <div class="merchant-select-row">
      <select id="mMerchant">
        <option value="">請選擇商家</option>
        <option value="其他">其他（自行輸入）</option>
      </select>
      <button type="button" id="pinMerchantBtn" title="釘選這個商家，下次自動選好">📌</button>
    </div>
    <input id="mMerchantOther" placeholder="請輸入商家名稱" style="display:none; margin-top:8px;">
    <div class="hint" id="pinnedHint" style="display:none;">📌 已記住這個商家，下次打開網頁會自動選好（點📌可取消）</div>
  </div>

  <div class="view-tabs">
    <button type="button" class="view-tab-btn active" id="tabSubmitBtn">📝 送出委託</button>
    <button type="button" class="view-tab-btn" id="tabQueryBtn">📋 查詢我的委託</button>
  </div>

  <div id="formBox">
    <div class="field">
      <label>客戶（收件人）姓名或暱稱</label>
      <input id="mCustomerName" placeholder="例：王小姐">
    </div>
    <div class="field">
      <label>客戶聯絡電話（必填，格式：0000-000-000 或 000-000000）</label>
      <input id="mPhone" type="tel" inputmode="numeric" placeholder="例：0912-345-678" maxlength="12">
    </div>
    <div class="field">
      <label>送達地址</label>
      <input id="mAddress" placeholder="例：成功鎮○○路○號，或明顯地標">
    </div>
    <div class="field">
      <label>拍照確認訂單內容（收據、出單畫面、品項清單皆可）</label>
      <div class="photo-upload-box">
        <input type="file" id="mPhoto" accept="image/*" capture="environment">
        <div class="photo-preview-box" id="photoPreviewBox">
          <img id="photoPreviewImg" src="" alt="訂單照片預覽">
          <button type="button" class="photo-remove-btn" id="photoRemoveBtn">移除照片</button>
        </div>
      </div>
      <div class="hint">照片只會存進後台管理表供外送員確認，若沒有照片，請至少填寫下方簡短說明</div>
    </div>
    <div class="field">
      <label>簡短品項說明（有拍照的話可選填，方便外送員快速辨識）</label>
      <input id="mItems" placeholder="例：便當2個、飲料1杯">
    </div>
    <div class="field">
      <label>商品金額（必填，方便外送員向客戶收款）</label>
      <input id="mGoodsAmount" type="number" inputmode="numeric" min="0" placeholder="例：350">
    </div>
    <div class="field">
      <label>範圍</label>
      <div class="zone-toggle">
        <button type="button" class="zone-btn active" data-fee="30">鎮內（$30）</button>
        <button type="button" class="zone-btn" data-fee="60">鎮外（$60）</button>
      </div>
    </div>
    <div class="field">
      <label>送達時間</label>
      <div class="schedule-toggle">
        <button type="button" class="sch-btn active" data-mode="now">立即送</button>
        <button type="button" class="sch-btn" data-mode="later">指定時間</button>
      </div>
      <input id="mSchedule" type="datetime-local" style="display:none;">
    </div>
    <div class="field">
      <label>備註（選填）</label>
      <input id="mNote" placeholder="例：貨到付款、需先電話聯繫">
    </div>

    <button type="button" class="submit-btn" id="submitBtn">送出委託 →</button>

    <div class="result-badge" id="resultBadge">
      <div class="num" id="resultNum">#0</div>
      <div class="label" id="resultLabel"></div>
    </div>
  </div>

  <div id="queryBox" style="display:none;">
    <div class="hint" style="margin-bottom:14px;">顯示這個商家歷來所有委託單的狀態，選好商家後自動查詢</div>
    <div id="queryResult"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEIJUec1kLTQN0c4rnwGWjrs219WgoqAaRQJwphOJpq_k_W6jY61tMfgByWmQQ646WUw/exec';

  const toastEl = document.getElementById('toast');
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 2400);
  }

  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'short' });

  // ---------- 商家名單：沿用主網站同一份「商家名單設定」資料，後台新增/編輯/刪除都會同步 ----------
  const PIN_MERCHANT_KEY = 'mifeng_pinned_merchant';

  function loadMerchants(){
    fetch(`${SCRIPT_URL}?t=${Date.now()}`, { cache:'no-store' })
      .then(r => r.json())
      .then(data => {
        // 公告：讀取「基本設定」裡的「商家委託公告內容」，留空就不顯示
        const announcement = ((data.settings && data.settings['商家委託公告內容']) || '').trim();
        const hintEl = document.getElementById('announcementHint');
        if(announcement){
          hintEl.textContent = announcement;
          hintEl.style.display = 'flex';
        } else {
          hintEl.style.display = 'none';
        }

        const sel = document.getElementById('mMerchant');
        const merchants = data.entrustingMerchants || [];
        const groups = {};
        const order = [];
        merchants.forEach(m => {
          const cat = m.category && m.category.trim() ? m.category.trim() : '其他商家';
          if(!groups[cat]){ groups[cat] = []; order.push(cat); }
          groups[cat].push(m);
        });

        sel.innerHTML = '<option value="">請選擇商家</option>';
        order.forEach(cat => {
          const optgroup = document.createElement('optgroup');
          optgroup.label = cat;
          groups[cat].forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.name;
            opt.textContent = m.name;
            optgroup.appendChild(opt);
          });
          sel.appendChild(optgroup);
        });
        const otherOpt = document.createElement('option');
        otherOpt.value = '其他';
        otherOpt.textContent = '其他（自行輸入）';
        sel.appendChild(otherOpt);

        // 商家名單載入完成後，如果之前釘選過商家、且這個商家還在名單裡，自動選好
        const pinned = localStorage.getItem(PIN_MERCHANT_KEY);
        if(pinned && Array.from(sel.options).some(o => o.value === pinned)){
          sel.value = pinned;
          updatePinBtn(true);
          if(currentTab === 'query') queryMerchantOrders();
        }
      })
      .catch(()=>{ toast('商家名單載入失敗，可直接選「其他」手動輸入'); });
  }
  loadMerchants();

  function updatePinBtn(isPinned){
    const btn = document.getElementById('pinMerchantBtn');
    const hint = document.getElementById('pinnedHint');
    btn.classList.toggle('pinned', isPinned);
    hint.style.display = isPinned ? 'block' : 'none';
  }

  document.getElementById('mMerchant').addEventListener('change', (e)=>{
    const isOther = e.target.value === '其他';
    document.getElementById('mMerchantOther').style.display = isOther ? 'block' : 'none';
    // 換了商家，之前釘選的就不算數了，要重新按📌才會釘選新的
    const pinned = localStorage.getItem(PIN_MERCHANT_KEY);
    updatePinBtn(pinned && pinned === e.target.value);
    if(currentTab === 'query') queryMerchantOrders();
  });

  document.getElementById('pinMerchantBtn').addEventListener('click', ()=>{
    const sel = document.getElementById('mMerchant');
    if(!sel.value || sel.value === '其他'){
      toast('請先選擇一個商家再釘選');
      return;
    }
    const alreadyPinned = localStorage.getItem(PIN_MERCHANT_KEY) === sel.value;
    if(alreadyPinned){
      localStorage.removeItem(PIN_MERCHANT_KEY);
      updatePinBtn(false);
      toast('已取消釘選');
    } else {
      localStorage.setItem(PIN_MERCHANT_KEY, sel.value);
      updatePinBtn(true);
      toast('📌 已記住這個商家，下次打開網頁會自動選好');
    }
  });

  // ---------- 頁籤切換：送出委託／查詢我的委託 ----------
  let currentTab = 'submit';
  const formBox = document.getElementById('formBox');
  const queryBox = document.getElementById('queryBox');
  const tabSubmitBtn = document.getElementById('tabSubmitBtn');
  const tabQueryBtn = document.getElementById('tabQueryBtn');

  tabSubmitBtn.addEventListener('click', ()=>{
    currentTab = 'submit';
    tabSubmitBtn.classList.add('active');
    tabQueryBtn.classList.remove('active');
    formBox.style.display = 'block';
    queryBox.style.display = 'none';
  });
  tabQueryBtn.addEventListener('click', ()=>{
    currentTab = 'query';
    tabQueryBtn.classList.add('active');
    tabSubmitBtn.classList.remove('active');
    formBox.style.display = 'none';
    queryBox.style.display = 'block';
    queryMerchantOrders();
  });

  function formatQueryTime(o){
    if(o.schedule){
      const d = new Date(o.schedule);
      if(!isNaN(d.getTime())){
        const pad = n => String(n).padStart(2,'0');
        return `預約 ${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }
    }
    return `${o.date} ${o.time} 送出`;
  }

  function queryMerchantOrders(){
    const sel = document.getElementById('mMerchant');
    const merchant = sel.value === '其他' ? document.getElementById('mMerchantOther').value.trim() : sel.value;
    const resultEl = document.getElementById('queryResult');

    if(!merchant){
      resultEl.innerHTML = '<div class="hint">請先在上方選擇商家，才能查詢委託記錄</div>';
      return;
    }

    resultEl.innerHTML = '<div class="hint">查詢中...</div>';

    fetch(`${SCRIPT_URL}?action=merchantOrders&merchant=${encodeURIComponent(merchant)}&t=${Date.now()}`, { cache:'no-store' })
      .then(r => r.json())
      .then(data => {
        const orders = data.orders || [];
        if(!orders.length){
          resultEl.innerHTML = '<div class="hint">📭 這個商家還沒有委託紀錄</div>';
          return;
        }

        // 依日期分組（訂單已經是新到舊排序，分組後組內順序不變）
        const groups = {};
        const groupOrder = [];
        orders.forEach(o => {
          const dateKey = o.date || '未知日期';
          if(!groups[dateKey]){ groups[dateKey] = []; groupOrder.push(dateKey); }
          groups[dateKey].push(o);
        });

        // 今天的日期用跟後端一樣的 yyyy/MM/dd 格式，才能正確比對
        const now = new Date();
        const pad = n => String(n).padStart(2,'0');
        const todayKey = `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}`;

        resultEl.innerHTML = '';
        groupOrder.forEach(dateKey => {
          const dayOrders = groups[dateKey];
          const details = document.createElement('details');
          details.className = 'query-date-group';
          details.open = (dateKey === todayKey); // 今天的訂單預設展開，其他日期預設收合

          const summary = document.createElement('summary');
          summary.innerHTML = `<span>${dateKey}${dateKey === todayKey ? '（今天）' : ''}</span><span class="qdg-count">共 ${dayOrders.length} 筆<span class="qdg-arrow">▸</span></span>`;
          details.appendChild(summary);

          const body = document.createElement('div');
          body.className = 'query-date-group-body';

          dayOrders.forEach(o => {
            const numLabel = String(o.queueNumber || '').startsWith('R') ? o.queueNumber : `#${o.queueNumber}`;
            const card = document.createElement('div');
            card.className = 'query-order-card';
            card.innerHTML = `
              <div class="qo-top">
                <span class="qo-num">${numLabel}</span>
                <span class="qo-status ${o.status || '待處理'}">${o.status || '待處理'}</span>
              </div>
              <div class="qo-time">${formatQueryTime(o)}</div>
              <div class="qo-row"><b>收件人：</b>${o.contact || '—'}</div>
              <div class="qo-row"><b>地址：</b>${o.address || '—'}</div>
              <div class="qo-row"><b>內容：</b>${o.items || '—'}</div>
              <div class="qo-row"><b>外送費：</b>$${o.fee || '—'}${o.goodsAmount ? `　商品 $${o.goodsAmount}` : ''}</div>
              ${o.deliverer ? `<div class="qo-row"><b>外送員：</b>${o.deliverer}</div>` : ''}
            `;
            body.appendChild(card);
          });

          details.appendChild(body);
          resultEl.appendChild(details);
        });
      })
      .catch(()=>{ resultEl.innerHTML = '<div class="hint">查詢失敗，請檢查網路連線</div>'; });
  }

  // ---------- 範圍切換 ----------
  let fee = 30;
  document.querySelectorAll('.zone-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.zone-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      fee = parseInt(btn.dataset.fee, 10);
    });
  });

  // ---------- 送達時間切換 ----------
  let scheduleMode = 'now';
  const scheduleInput = document.getElementById('mSchedule');
  document.querySelectorAll('.sch-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.sch-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      scheduleMode = btn.dataset.mode;
      scheduleInput.style.display = (scheduleMode === 'later') ? 'block' : 'none';
    });
  });
  (function setScheduleMin(){
    const now = new Date(Date.now() - Date.now() % 60000);
    const pad = n => String(n).padStart(2, '0');
    scheduleInput.min = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  })();

  // ---------- 拍照確認訂單（壓縮後轉base64，做法跟主網站一致） ----------
  let photoBase64 = null;
  let photoMime = null;

  function compressImage(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('讀取檔案失敗'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('圖片解析失敗'));
        img.onload = () => {
          const maxSize = 1000;
          let { width, height } = img;
          if(width > maxSize || height > maxSize){
            if(width > height){ height = Math.round(height * maxSize / width); width = maxSize; }
            else { width = Math.round(width * maxSize / height); height = maxSize; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
          resolve({ base64: dataUrl.split(',')[1], mime: 'image/jpeg', preview: dataUrl });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('mPhoto').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      toast('照片處理中...');
      const { base64, mime, preview } = await compressImage(file);
      photoBase64 = base64;
      photoMime = mime;
      document.getElementById('photoPreviewImg').src = preview;
      document.getElementById('photoPreviewBox').style.display = 'flex';
      toast('照片已附上');
    }catch(err){
      toast('照片處理失敗，請換一張試試');
      e.target.value = '';
    }
  });

  function clearPhoto(){
    photoBase64 = null;
    photoMime = null;
    document.getElementById('mPhoto').value = '';
    document.getElementById('photoPreviewBox').style.display = 'none';
    document.getElementById('photoPreviewImg').src = '';
  }
  document.getElementById('photoRemoveBtn').addEventListener('click', clearPhoto);

  function isValidPhone(raw){
    const digits = raw.replace(/\D/g, '');
    return digits.length === 9 || digits.length === 10;
  }

  function formatPhoneOnBlur(){
    const el = document.getElementById('mPhone');
    const digits = el.value.replace(/\D/g, '');
    if(digits.length === 10){
      el.value = digits.slice(0,4) + '-' + digits.slice(4,7) + '-' + digits.slice(7);
    } else if(digits.length === 9){
      el.value = digits.slice(0,3) + '-' + digits.slice(3);
    }
  }
  document.getElementById('mPhone').addEventListener('blur', formatPhoneOnBlur);

  function getMerchantValue(){
    const sel = document.getElementById('mMerchant').value;
    if(sel === '其他'){
      return document.getElementById('mMerchantOther').value.trim();
    }
    return sel;
  }

  // ---------- 送出委託 ----------
  document.getElementById('submitBtn').addEventListener('click', async ()=>{
    formatPhoneOnBlur(); // 確保送出前電話已經是排版好的格式
    const merchant = getMerchantValue();
    const customerName = document.getElementById('mCustomerName').value.trim();
    const phone = document.getElementById('mPhone').value.trim();
    const address = document.getElementById('mAddress').value.trim();
    const itemsNote = document.getElementById('mItems').value.trim();
    const goodsAmount = document.getElementById('mGoodsAmount').value.trim();
    const note = document.getElementById('mNote').value.trim();

    if(!merchant){ toast('請選擇或填寫商家名稱'); return; }
    if(!phone || !isValidPhone(phone)){ toast('請填寫正確的客戶電話'); return; }
    if(!address){ toast('請填寫送達地址'); return; }
    if(!photoBase64 && !itemsNote){ toast('請拍照確認訂單內容，或至少填寫簡短品項說明'); return; }
    if(!goodsAmount || Number(goodsAmount) <= 0){ toast('請填寫商品金額'); return; }

    let schedule = '';
    if(scheduleMode === 'later'){
      if(!scheduleInput.value){ toast('請選擇指定送達時間'); return; }
      if(new Date(scheduleInput.value).getTime() < Date.now()){ toast('送達時間不能是過去的時間'); return; }
      schedule = scheduleInput.value;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '送出中...';

    const itemsSummary = `【收件人】${customerName || '（未填寫姓名）'}${itemsNote ? `：${itemsNote}` : '（詳見附件照片）'}`;

    const payload = {
      orderType: '商家外送委託',
      merchant: merchant,
      items: itemsSummary,
      address: address,
      phone: phone,
      contact: customerName || merchant,
      note: note,
      schedule: schedule,
      zone: fee === 30 ? '鎮內' : '鎮外',
      fee: fee,
      goodsAmount: goodsAmount,
      paymentMethod: '現場付款',
      photoBase64: photoBase64,
      photoMime: photoMime
    };

    try{
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      const result = await res.json();

      const badge = document.getElementById('resultBadge');
      if(result && result.result === 'error'){
        badge.className = 'result-badge error';
        document.getElementById('resultNum').textContent = '❌';
        document.getElementById('resultLabel').textContent = result.message || '送出失敗，請稍後再試';
        badge.style.display = 'block';
      } else {
        badge.className = 'result-badge';
        document.getElementById('resultNum').textContent = result && result.queueNumber ? `#${result.queueNumber}` : '✓';
        document.getElementById('resultLabel').textContent = '委託已送出，外送員會盡快處理';
        badge.style.display = 'block';
        document.getElementById('mMerchant').value = '';
        document.getElementById('mMerchantOther').value = '';
        document.getElementById('mMerchantOther').style.display = 'none';
        document.getElementById('mCustomerName').value = '';
        document.getElementById('mPhone').value = '';
        document.getElementById('mAddress').value = '';
        document.getElementById('mItems').value = '';
        document.getElementById('mGoodsAmount').value = '';
        document.getElementById('mNote').value = '';
        clearPhoto();
        scheduleInput.value = '';
        document.querySelectorAll('.sch-btn').forEach(b=>b.classList.remove('active'));
        document.querySelector('.sch-btn[data-mode="now"]').classList.add('active');
        scheduleMode = 'now';
        scheduleInput.style.display = 'none';
      }
    }catch(err){
      toast('送出失敗，請檢查網路連線');
    }

    btn.disabled = false;
    btn.textContent = '送出委託 →';
  });

})();
</script>
</body>
</html>
